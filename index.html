<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CASPER - SMK Pertiwi Waste AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Quicksand", sans-serif;
        background-image: url("https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
      }
      .glass {
        background: rgba(255, 255, 255, 0.25);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.18);
      }
      .glass-input {
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(4px);
      }
      .glass-btn {
        background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }
      .fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .loader {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid white;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="p-4">
    <main
      class="w-full max-w-md glass p-6 relative min-h-[600px] flex flex-col"
    >
      <header class="text-center mb-6">
        <div
          class="inline-block p-3 rounded-full bg-white/30 mb-2 backdrop-blur-sm"
        >
          <span class="text-4xl">👻♻️</span>
        </div>
        <h1 class="text-3xl font-bold text-gray-800 drop-shadow-sm">CASPER GO GREEN</h1>
        <p class="text-emerald-800 font-semibold text-sm opacity-80">
          Asisten Kebersihan SMK Pertiwi
        </p>
        <div
          class="absolute top-6 right-6 bg-white/40 px-3 py-1 rounded-full border border-white/50 backdrop-blur-md"
        >
          <span class="text-xs font-bold text-emerald-900"
            >XP: <span id="user-xp">0</span></span
          >
        </div>
      </header>
      <div class="flex p-1 bg-black/5 rounded-2xl mb-6 backdrop-blur-sm">
        <button
          onclick="_st('scan')"
          id="tab-scan"
          class="flex-1 py-2 rounded-xl text-sm font-bold transition-all bg-white shadow-sm text-emerald-700"
        >
          🔍 Cek Sampah
        </button>
        <button
          onclick="_st('game')"
          id="tab-game"
          class="flex-1 py-2 rounded-xl text-sm font-bold text-gray-600 hover:text-emerald-700"
        >
          🎮 Mini Game
        </button>
      </div>
      <div id="view-scan" class="flex-1 flex flex-col gap-4 fade-in">
        <div>
          <label
            class="block text-xs font-bold text-gray-600 uppercase mb-2 pl-2"
            >Lagi dimana?</label
          >
          <div class="relative">
            <select
              id="locationInput"
              class="w-full p-4 glass-input rounded-xl appearance-none font-bold text-gray-700 outline-none focus:ring-2 focus:ring-emerald-400 cursor-pointer"
            >
              <option value="Depan Lab 1">📍 Depan Lab 1 (Komputer)</option>
              <option value="Depan COE TKJ">📍 Depan COE (TKJ)</option>
              <option value="Depan SPW">📍 Depan SPW</option>
              <option value="Dalam Kelas">🏫 Di Dalam Kelas</option>
              <option value="Kantin">🍜 Kantin Sekolah</option>
              <option value="Gerbang Sekolah">🚪 Gerbang Sekolah</option>
            </select>
          </div>
        </div>
        <div>
          <label
            class="block text-xs font-bold text-gray-600 uppercase mb-2 pl-2"
            >Sampah apa?</label
          ><input
            type="text"
            id="trashInput"
            placeholder="Contoh: Plastik cilok, botol..."
            class="w-full p-4 glass-input rounded-xl font-bold text-gray-700 outline-none focus:ring-2 focus:ring-emerald-400 placeholder-gray-500"
          />
        </div>
        <button
          onclick="_ac()"
          id="btn-ask"
          class="w-full glass-btn text-white font-bold py-4 rounded-xl transition-transform active:scale-95 flex justify-center items-center gap-2 mt-2"
        >
          <span>Tanya Casper</span>
          <div id="loader" class="loader hidden"></div>
        </button>
        <div
          id="ai-result"
          class="hidden mt-4 bg-white/60 backdrop-blur-md border border-white/50 rounded-2xl p-5 relative overflow-hidden"
        >
          <div class="flex items-start gap-4">
            <div id="res-emoji" class="text-5xl bg-white/50 p-2 rounded-2xl">
              🗑️
            </div>
            <div>
              <span
                id="res-type"
                class="inline-block text-[10px] font-bold text-white px-2 py-0.5 rounded-md mb-1 bg-gray-400"
                >ANALYZING</span
              >
              <h3
                id="res-direction"
                class="font-bold text-gray-800 text-md leading-tight"
              >
                ...
              </h3>
            </div>
          </div>
          <div class="mt-3 pt-3 border-t border-gray-200/50">
            <p class="text-xs font-bold text-emerald-800 mb-1">💡 FUN FACT:</p>
            <p id="res-fact" class="text-xs text-gray-600 italic">...</p>
          </div>
        </div>
      </div>
      <div
        id="view-game"
        class="flex-1 hidden flex-col justify-center text-center fade-in"
      >
        <div id="game-start">
          <div class="text-6xl mb-4 animate-bounce">🌍</div>
          <h2 class="text-2xl font-bold text-gray-800">Quiz Pemilah!</h2>
          <p class="text-gray-600 text-sm mt-2 mb-8">
            Buktikan kamu peserta didik yang peduli lingkungan.
          </p>
          <button
            onclick="_sg()"
            class="w-full glass-btn text-white font-bold py-4 rounded-xl shadow-lg hover:brightness-110 transition"
          >
            Mulai Main (+XP)
          </button>
        </div>
        <div id="game-play" class="hidden text-left">
          <div class="flex justify-between items-center mb-6">
            <span class="text-xs font-bold text-gray-500">PERTANYAAN</span
            ><span
              id="q-counter"
              class="text-xs font-bold text-emerald-600 bg-white/50 px-2 py-1 rounded-md"
              >1/5</span
            >
          </div>
          <h3
            id="q-text"
            class="text-lg font-bold text-gray-800 mb-6 leading-relaxed"
          >
            Soal...
          </h3>
          <div id="q-options" class="space-y-3"></div>
          <div
            id="q-feedback"
            class="hidden mt-4 p-3 rounded-xl text-center font-bold text-sm bg-white/40 backdrop-blur-md"
          ></div>
        </div>
        <div id="game-end" class="hidden">
          <div class="text-6xl mb-2">🏆</div>
          <h2 class="text-4xl font-bold text-emerald-800 mb-1" id="final-score">
            0
          </h2>
          <p class="text-gray-600 font-bold text-sm mb-8">Poin Didapat</p>
          <button
            onclick="_rg()"
            class="w-full glass-btn text-white font-bold py-4 rounded-xl"
          >
            Main Lagi
          </button>
        </div>
      </div>
    </main>
    <script>
      /* CASPER CORE V1.0 - SMK PERTIWI */
      
      // Initialize XP
      let _xp = parseInt(localStorage.getItem("CASPER_XP")) || 0;
      document.getElementById("user-xp").innerText = _xp;
      
      // Switch Tabs
      function _st(t) {
        const views = {
            scan: document.getElementById("view-scan"),
            game: document.getElementById("view-game"),
          },
          buttons = {
            scan: document.getElementById("tab-scan"),
            game: document.getElementById("tab-game"),
          };
        
        // Hide all views
        Object.values(views).forEach((view) => view.classList.add("hidden"));
        
        // Show selected view
        views[t].classList.remove("hidden");
        
        // Reset all buttons
        Object.values(buttons).forEach((btn) => {
          btn.className = "flex-1 py-2 rounded-xl text-sm font-bold text-gray-600 hover:text-emerald-700";
        });
        
        // Highlight selected button
        buttons[t].className = "flex-1 py-2 rounded-xl text-sm font-bold transition-all bg-white shadow-sm text-emerald-700";
      }
      
      // Ask Casper AI
      async function _ac() {
        const trash = document.getElementById("trashInput").value.trim();
        const location = document.getElementById("locationInput").value;
        
        if (!trash) {
          alert("Isi dulu nama sampahnya ya!");
          return;
        }
        
        const button = document.getElementById("btn-ask");
        const loader = document.getElementById("loader");
        const resultBox = document.getElementById("ai-result");
        
        // Disable button and show loader
        button.disabled = true;
        button.classList.add("opacity-75");
        loader.classList.remove("hidden");
        resultBox.classList.add("hidden");
        
        // Prepare prompt
        const prompt = `Role: You are CASPER, a friendly AI robot at SMK Pertiwi Kuningan. User Location: ${location}. Trash Item: ${trash}. SCHOOL RULES: 1. Depan Lab 1: Has 2 Bins (Organic & Anorganic). 2. Depan COE (TKJ): Has 1 Bin (General). Use it but advise separation if possible. 3. Dalam Kelas: Small bin for dry waste. 4. Depan SPW & Gerbang: General bins available. 5. Kantin: Bins available at stalls. TASK: 1. Categorize trash (Organic/Anorganic/B3). 2. Give specific direction based on User Location rules above. 3. Provide a short Fun Fact. OUTPUT JSON ONLY: { "type": "ORGANIK" or "ANORGANIK" or "B3", "color": "green" or "yellow" or "red", "emoji": "trash emoji", "direction": "Short Indonesian instruction on which bin to use at ${location}.", "fact": "Short fun fact in Indonesian." }`;
        
        try {
          // Call our API route
          const response = await fetch("/api/casper", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }]
            }),
          });
          
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          
          const data = await response.json();
          
          // Check for API errors
          if (data.error) {
            throw new Error(data.error.message || "API Error");
          }
          
          // Extract text from response
          const responseText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          
          if (!responseText) {
            throw new Error("No response from AI");
          }
          
          // Clean and parse JSON
          const cleanText = responseText.replace(/```json|```/g, "").trim();
          const result = JSON.parse(cleanText);
          
          // Update UI with results
          document.getElementById("res-emoji").innerText = result.emoji || "🗑️";
          document.getElementById("res-direction").innerText = result.direction || "Tidak ada instruksi";
          document.getElementById("res-fact").innerText = result.fact || "Tidak ada fakta";
          
          const typeBadge = document.getElementById("res-type");
          typeBadge.innerText = result.type || "TIDAK DIKETAHUI";
          
          // Set color based on type
          let badgeColor = "bg-gray-500";
          if (result.color === "green") badgeColor = "bg-green-500";
          else if (result.color === "yellow") badgeColor = "bg-yellow-500";
          else if (result.color === "red") badgeColor = "bg-red-500";
          
          typeBadge.className = `inline-block text-[10px] font-bold text-white px-2 py-0.5 rounded-md mb-1 ${badgeColor}`;
          
          // Add XP and show result
          _axp(15);
          resultBox.classList.remove("hidden");
          resultBox.classList.add("fade-in");
          
        } catch (error) {
          console.error("Error:", error);
          alert("Gagal memproses permintaan: " + error.message);
        } finally {
          // Re-enable button and hide loader
          button.disabled = false;
          button.classList.remove("opacity-75");
          loader.classList.add("hidden");
        }
      }
      
      // Game Questions
      const _qs = [
        {
          q: "Bekas bungkus cilok plastik masuk mana?",
          o: ["Organik", "Anorganik", "B3"],
          a: 1,
        },
        {
          q: "Daun kering depan Lab RPL?",
          o: ["Organik", "Anorganik", "Bakar"],
          a: 0,
        },
        {
          q: "Baterai bekas jam dinding?",
          o: ["Organik", "Anorganik", "B3 (Limbah B3)"],
          a: 2,
        },
        {
          q: "Kertas ulangan harian yg gakepake?",
          o: ["Organik", "Anorganik", "B3"],
          a: 1,
        },
        {
          q: "Sisa nasi uduk kantin?",
          o: ["Organik", "Anorganik", "B3"],
          a: 0,
        },
      ];
      
      let _qi = 0; // Current question index
      let _sc = 0; // Current score
      
      // Start Game
      function _sg() {
        _qi = 0;
        _sc = 0;
        document.getElementById("game-start").classList.add("hidden");
        document.getElementById("game-play").classList.remove("hidden");
        document.getElementById("game-end").classList.add("hidden");
        _lq();
      }
      
      // Load Question
      function _lq() {
        const question = _qs[_qi];
        
        // Update counter
        document.getElementById("q-counter").innerText = `${_qi + 1}/${_qs.length}`;
        
        // Set question text
        document.getElementById("q-text").innerText = question.q;
        
        // Clear and create options
        const optionsContainer = document.getElementById("q-options");
        optionsContainer.innerHTML = "";
        
        // Hide feedback
        document.getElementById("q-feedback").classList.add("hidden");
        
        // Create option buttons
        question.o.forEach((option, index) => {
          const button = document.createElement("button");
          button.className = "w-full text-left p-4 rounded-xl bg-white/60 hover:bg-white/80 border border-white/40 font-bold text-gray-700 transition-all";
          button.innerText = option;
          button.onclick = () => _ca(index, question.a, button);
          optionsContainer.appendChild(button);
        });
      }
      
      // Check Answer
      function _ca(selectedIndex, correctIndex, button) {
        const feedback = document.getElementById("q-feedback");
        
        // Disable all buttons
        document.querySelectorAll("#q-options button").forEach((btn) => {
          btn.disabled = true;
        });
        
        feedback.classList.remove("hidden");
        
        if (selectedIndex === correctIndex) {
          // Correct answer
          _sc += 20;
          button.style.background = "#d1fae5";
          feedback.innerText = "✅ Benar!";
          feedback.style.color = "#065f46";
          feedback.style.background = "#d1fae5";
        } else {
          // Wrong answer
          button.style.background = "#fee2e2";
          feedback.innerText = "❌ Salah!";
          feedback.style.color = "#991b1b";
          feedback.style.background = "#fee2e2";
        }
        
        // Move to next question after delay
        setTimeout(() => {
          _qi++;
          if (_qi < _qs.length) {
            _lq();
          } else {
            _eg();
          }
        }, 1500);
      }
      
      // End Game
      function _eg() {
        document.getElementById("game-play").classList.add("hidden");
        document.getElementById("game-end").classList.remove("hidden");
        document.getElementById("final-score").innerText = _sc;
        _axp(_sc);
      }
      
      // Restart Game
      function _rg() {
        _sg();
      }
      
      // Add XP
      function _axp(points) {
        _xp += points;
        document.getElementById("user-xp").innerText = _xp;
        localStorage.setItem("CASPER_XP", _xp);
      }
      
      // Initialize with scan tab
      _st('scan');
    </script>
  </body>
</html>
